# ---------------------------------------------------------------------------
# Fork branding / disguise profile
#
# The build rewrites the upstream identity with the values below BEFORE Gradle
# runs (see scripts/apply_branding.py, invoked by .github/workflows/main.yml).
#
# KEEP THESE VALUES STABLE: they are the installed app identity
# (applicationId + label + module id + state dir). Changing them produces an
# APK that can NOT update an already installed build.
#
# Current values are the ones shipped with release oss-173
# (https://github.com/keweiya/HMA-OSS/releases/tag/oss-173), so a new release
# installs over oss-173 as a normal update.
#
# Re-roll everything:      python3 scripts/roll_branding.py
# Re-roll the icon only:   python3 scripts/roll_branding.py --icon-only
# ---------------------------------------------------------------------------

# Manager app package name (applicationId). Shows up as <codename> in the
# launcher and in "pm list packages". Must be a valid, unused package name.
appId=io.moonlit.quarry

# Launcher label (app_name).
appLabel=Quarry

# Short code name used for the Zygisk module id, the manager state directory
# (/data/misc/<codename>_state_*), the boot script (/data/adb/.../<codename>.sh)
# and the module installation folder (/data/adb/modules/<codename>).
codename=quarry

# Deterministic seed for the generated launcher icon (any integer).
iconSeed=6807152034

# Lowest versionCode a new build may carry. Android only installs an update
# when versionCode >= the installed one, so this guards against a release that
# silently cannot update over the previous one (oss-173 shipped 7304656).
minVersionCode=7304656

# Signer / module metadata.
author=keweiya
moduleName=HMA-OSS Zygisk

# Fork repository, used for in-app update checks and the module update channel.
repo=keweiya/HMA-OSS
updateCheckApi=https://api.github.com/repos/keweiya/HMA-OSS/releases/latest
moduleUpdateJson=https://github.com/keweiya/HMA-OSS/releases/latest/download/update.json
